services:
  minni-frozen-surprise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minni-frozen-surprise
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/stats || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
